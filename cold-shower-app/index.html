<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Cold Shower Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===== MAIN MENU SCREEN ===== -->
    <div id="main-menu" class="screen active">
        <div class="menu-container">
            <div class="symbol-row top-row">
                <div class="symbol-item" id="kaelte-btn">
                    <img src="kaelte.jpg" alt="Kälte" class="symbol-img">
                </div>
            </div>
            <div class="symbol-row bottom-row">
                <div class="symbol-item" id="geist-btn">
                    <img src="geist.jpg" alt="Geist" class="symbol-img">
                </div>
                <div class="symbol-item" id="atem-btn">
                    <img src="atem.jpg" alt="Atem" class="symbol-img">
                </div>
            </div>
        </div>
    </div>

    <!-- ===== KÄLTE SUB-MENU SCREEN ===== -->
    <div id="kaelte-menu" class="screen">
        <button class="back-btn" id="back-to-main">&larr;</button>
        <div class="kaelte-container">
            <div class="eisdusche-symbol" id="eisdusche-btn">
                <img src="eisdusche.jpg" alt="Eisdusche" class="eisdusche-img">
                <span class="symbol-label">EISDUSCHE</span>
            </div>
        </div>
    </div>

    <!-- ===== COLD SHOWER TRACKER SCREEN ===== -->
    <div id="tracker-screen" class="screen">
        <button class="back-btn" id="back-to-kaelte">&larr;</button>

        <!-- Setup View -->
        <div id="setup-view" class="tracker-view">
            <h1 class="tracker-title">EISDUSCHE</h1>
            <img src="eisdusche.jpg" alt="Eisdusche" class="tracker-icon">

            <div class="slider-group">
                <label class="slider-label">
                    <span class="label-text">Vorbereitung</span>
                    <span class="label-value" id="prep-value">1:00</span>
                </label>
                <input type="range" id="prep-slider" class="slider" min="0" max="300" value="60" step="15">
            </div>

            <div class="slider-group">
                <label class="slider-label">
                    <span class="label-text">Wassertemperatur</span>
                    <span class="label-value" id="temp-value">10°C</span>
                </label>
                <input type="range" id="temp-slider" class="slider temp-slider" min="1" max="20" value="10" step="1">
            </div>

            <div class="slider-group">
                <label class="slider-label">
                    <span class="label-text">Duschdauer</span>
                    <span class="label-value" id="duration-value">2:00</span>
                </label>
                <input type="range" id="duration-slider" class="slider" min="15" max="600" value="120" step="15">
            </div>

            <button class="start-btn" id="start-btn">START</button>
        </div>

        <!-- Timer View -->
        <div id="timer-view" class="tracker-view hidden">
            <div class="timer-phase" id="timer-phase">VORBEREITUNG</div>
            <div class="timer-display" id="timer-display">1:00</div>
            <div class="timer-temp" id="timer-temp"></div>
            <div class="progress-ring-container">
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <circle class="progress-ring-bg" cx="100" cy="100" r="90"/>
                    <circle class="progress-ring-fill" id="progress-circle" cx="100" cy="100" r="90"/>
                </svg>
            </div>
            <button class="stop-btn" id="stop-btn">ABBRECHEN</button>
        </div>

        <!-- Done View -->
        <div id="done-view" class="tracker-view hidden">
            <div class="done-icon">&#10003;</div>
            <h2 class="done-title">GESCHAFFT!</h2>
            <div class="done-stats">
                <div class="stat">
                    <span class="stat-label">Dauer</span>
                    <span class="stat-value" id="stat-duration"></span>
                </div>
                <div class="stat">
                    <span class="stat-label">Temperatur</span>
                    <span class="stat-value" id="stat-temp"></span>
                </div>
            </div>
            <button class="start-btn" id="done-btn">ZURÜCK</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
