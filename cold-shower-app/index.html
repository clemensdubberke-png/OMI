<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Cold Shower Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===== SVG SYMBOL DEFINITIONS ===== -->
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- KÄLTE Symbol (Frozen Snowflake Plaque) -->
            <symbol id="icon-kaelte" viewBox="0 0 400 480">
                <defs>
                    <linearGradient id="kg1" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#d4eaf5"/>
                        <stop offset="50%" stop-color="#a0cde4"/>
                        <stop offset="100%" stop-color="#7ab0d0"/>
                    </linearGradient>
                    <linearGradient id="kg2" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#e8f4fa"/>
                        <stop offset="100%" stop-color="#90c5dd"/>
                    </linearGradient>
                    <filter id="kf1" x="-5%" y="-5%" width="110%" height="110%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
                        <feOffset dx="2" dy="2" result="offset"/>
                        <feComposite in="SourceGraphic" in2="offset" operator="over"/>
                    </filter>
                </defs>
                <!-- Frozen plate background -->
                <rect x="15" y="15" width="370" height="450" rx="12" fill="url(#kg1)" stroke="#6a9fb8" stroke-width="4"/>
                <!-- Frost texture overlay -->
                <rect x="15" y="15" width="370" height="450" rx="12" fill="url(#kg1)" opacity="0.3"/>
                <!-- Corner bolts -->
                <circle cx="40" cy="40" r="8" fill="#8cb8cc" stroke="#5a8fa5" stroke-width="2"/>
                <circle cx="360" cy="40" r="8" fill="#8cb8cc" stroke="#5a8fa5" stroke-width="2"/>
                <circle cx="40" cy="440" r="8" fill="#8cb8cc" stroke="#5a8fa5" stroke-width="2"/>
                <circle cx="360" cy="440" r="8" fill="#8cb8cc" stroke="#5a8fa5" stroke-width="2"/>
                <!-- Snowflake -->
                <g transform="translate(200,210)" stroke="#8fc0d8" fill="none" filter="url(#kf1)">
                    <!-- Main vertical arm -->
                    <line x1="0" y1="-100" x2="0" y2="100" stroke-width="12" stroke-linecap="round"/>
                    <!-- Main diagonal arms -->
                    <line x1="-87" y1="-50" x2="87" y2="50" stroke-width="12" stroke-linecap="round"/>
                    <line x1="-87" y1="50" x2="87" y2="-50" stroke-width="12" stroke-linecap="round"/>
                    <!-- Vertical arm branches -->
                    <line x1="0" y1="-70" x2="-28" y2="-42" stroke-width="7" stroke-linecap="round"/>
                    <line x1="0" y1="-70" x2="28" y2="-42" stroke-width="7" stroke-linecap="round"/>
                    <line x1="0" y1="70" x2="-28" y2="42" stroke-width="7" stroke-linecap="round"/>
                    <line x1="0" y1="70" x2="28" y2="42" stroke-width="7" stroke-linecap="round"/>
                    <!-- Upper-right arm branches -->
                    <line x1="60" y1="-35" x2="60" y2="-68" stroke-width="7" stroke-linecap="round"/>
                    <line x1="60" y1="-35" x2="35" y2="-45" stroke-width="7" stroke-linecap="round"/>
                    <!-- Lower-left arm branches -->
                    <line x1="-60" y1="35" x2="-60" y2="68" stroke-width="7" stroke-linecap="round"/>
                    <line x1="-60" y1="35" x2="-35" y2="45" stroke-width="7" stroke-linecap="round"/>
                    <!-- Upper-left arm branches -->
                    <line x1="-60" y1="-35" x2="-60" y2="-68" stroke-width="7" stroke-linecap="round"/>
                    <line x1="-60" y1="-35" x2="-35" y2="-45" stroke-width="7" stroke-linecap="round"/>
                    <!-- Lower-right arm branches -->
                    <line x1="60" y1="35" x2="60" y2="68" stroke-width="7" stroke-linecap="round"/>
                    <line x1="60" y1="35" x2="35" y2="45" stroke-width="7" stroke-linecap="round"/>
                    <!-- Tips - icicle effects -->
                    <line x1="0" y1="-100" x2="-8" y2="-115" stroke-width="4" stroke-linecap="round"/>
                    <line x1="0" y1="-100" x2="8" y2="-118" stroke-width="4" stroke-linecap="round"/>
                    <line x1="0" y1="-100" x2="0" y2="-120" stroke-width="5" stroke-linecap="round"/>
                    <line x1="87" y1="-50" x2="98" y2="-62" stroke-width="4" stroke-linecap="round"/>
                    <line x1="-87" y1="-50" x2="-98" y2="-62" stroke-width="4" stroke-linecap="round"/>
                    <line x1="87" y1="50" x2="98" y2="55" stroke-width="4" stroke-linecap="round"/>
                    <line x1="-87" y1="50" x2="-98" y2="55" stroke-width="4" stroke-linecap="round"/>
                    <line x1="0" y1="100" x2="0" y2="118" stroke-width="4" stroke-linecap="round"/>
                    <!-- Center crystal -->
                    <circle cx="0" cy="0" r="10" fill="#d0e8f2" stroke="#8fc0d8" stroke-width="3"/>
                </g>
                <!-- KÄLTE text -->
                <text x="200" y="420" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="bold" fill="#5a8fa8" letter-spacing="6">KÄLTE</text>
            </symbol>

            <!-- GEIST Symbol (Bronze Brain Plaque) -->
            <symbol id="icon-geist" viewBox="0 0 400 480">
                <defs>
                    <linearGradient id="gg1" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#c8a050"/>
                        <stop offset="30%" stop-color="#a07830"/>
                        <stop offset="60%" stop-color="#8a6828"/>
                        <stop offset="100%" stop-color="#6a5020"/>
                    </linearGradient>
                    <radialGradient id="gg2" cx="50%" cy="40%">
                        <stop offset="0%" stop-color="#d4b878"/>
                        <stop offset="100%" stop-color="#8a6828"/>
                    </radialGradient>
                    <radialGradient id="gg3" cx="50%" cy="50%">
                        <stop offset="0%" stop-color="#e0d0a0"/>
                        <stop offset="40%" stop-color="#c0a060"/>
                        <stop offset="100%" stop-color="#705020"/>
                    </radialGradient>
                </defs>
                <!-- Bronze plate -->
                <rect x="15" y="15" width="370" height="450" rx="8" fill="url(#gg1)" stroke="#6a5020" stroke-width="4"/>
                <!-- Patina overlay -->
                <rect x="15" y="15" width="185" height="225" rx="8" fill="#4a7060" opacity="0.15"/>
                <rect x="200" y="240" width="185" height="225" rx="8" fill="#4a7060" opacity="0.1"/>
                <!-- Corner bolts -->
                <circle cx="38" cy="38" r="9" fill="#9a7838" stroke="#6a5020" stroke-width="2"/>
                <circle cx="362" cy="38" r="9" fill="#9a7838" stroke="#6a5020" stroke-width="2"/>
                <circle cx="38" cy="442" r="9" fill="#9a7838" stroke="#6a5020" stroke-width="2"/>
                <circle cx="362" cy="442" r="9" fill="#9a7838" stroke="#6a5020" stroke-width="2"/>
                <!-- Head silhouette -->
                <g transform="translate(200,200)">
                    <!-- Head outline -->
                    <path d="M-10,120 C-50,120 -80,90 -90,50 C-100,10 -95,-30 -80,-60 C-65,-90 -40,-115 -10,-125 C20,-135 55,-125 75,-100 C95,-75 100,-40 95,-5 C90,30 75,60 55,85 C45,95 30,110 20,120 Z"
                          fill="url(#gg2)" stroke="#6a5020" stroke-width="3"/>
                    <!-- Neck -->
                    <path d="M-10,120 L-10,150 L20,150 L20,120" fill="url(#gg2)" stroke="#6a5020" stroke-width="3"/>
                    <!-- Brain area - gears and spirals -->
                    <!-- Gear 1 -->
                    <circle cx="-20" cy="-40" r="22" fill="none" stroke="#6a5020" stroke-width="3"/>
                    <circle cx="-20" cy="-40" r="15" fill="none" stroke="#6a5020" stroke-width="2"/>
                    <circle cx="-20" cy="-40" r="5" fill="#d4b070"/>
                    <!-- Gear teeth -->
                    <line x1="-20" y1="-62" x2="-20" y2="-67" stroke="#6a5020" stroke-width="4" stroke-linecap="round"/>
                    <line x1="-20" y1="-18" x2="-20" y2="-13" stroke="#6a5020" stroke-width="4" stroke-linecap="round"/>
                    <line x1="-42" y1="-40" x2="-47" y2="-40" stroke="#6a5020" stroke-width="4" stroke-linecap="round"/>
                    <line x1="2" y1="-40" x2="7" y2="-40" stroke="#6a5020" stroke-width="4" stroke-linecap="round"/>
                    <!-- Gear 2 (smaller) -->
                    <circle cx="30" cy="-55" r="14" fill="none" stroke="#6a5020" stroke-width="2.5"/>
                    <circle cx="30" cy="-55" r="8" fill="none" stroke="#6a5020" stroke-width="2"/>
                    <circle cx="30" cy="-55" r="3" fill="#d4b070"/>
                    <!-- Gear 3 -->
                    <circle cx="40" cy="-15" r="16" fill="none" stroke="#6a5020" stroke-width="2.5"/>
                    <circle cx="40" cy="-15" r="10" fill="none" stroke="#6a5020" stroke-width="2"/>
                    <circle cx="40" cy="-15" r="4" fill="#d4b070"/>
                    <!-- Spiral decorations -->
                    <path d="M-40,-70 C-30,-80 -15,-75 -15,-65 C-15,-55 -30,-52 -35,-60" fill="none" stroke="#6a5020" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M10,-85 C20,-95 35,-88 33,-78 C31,-68 16,-66 13,-76" fill="none" stroke="#6a5020" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Center glow -->
                    <circle cx="5" cy="-45" r="12" fill="url(#gg3)" opacity="0.6"/>
                </g>
                <!-- GEIST text -->
                <text x="200" y="425" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="bold" fill="#6a5020" letter-spacing="6">GEIST</text>
            </symbol>

            <!-- ATEM Symbol (Bronze Wind Plaque) -->
            <symbol id="icon-atem" viewBox="0 0 400 480">
                <defs>
                    <linearGradient id="ag1" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#c8a050"/>
                        <stop offset="30%" stop-color="#a07830"/>
                        <stop offset="60%" stop-color="#8a6828"/>
                        <stop offset="100%" stop-color="#6a5020"/>
                    </linearGradient>
                    <linearGradient id="ag2" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#d4b878"/>
                        <stop offset="100%" stop-color="#8a6828"/>
                    </linearGradient>
                </defs>
                <!-- Bronze plate -->
                <rect x="15" y="15" width="370" height="450" rx="8" fill="url(#ag1)" stroke="#6a5020" stroke-width="4"/>
                <!-- Patina overlay -->
                <rect x="100" y="15" width="185" height="225" rx="4" fill="#4a7060" opacity="0.12"/>
                <rect x="15" y="240" width="185" height="225" rx="4" fill="#4a7060" opacity="0.08"/>
                <!-- Corner bolts -->
                <circle cx="38" cy="38" r="9" fill="#9a7838" stroke="#6a5020" stroke-width="2"/>
                <circle cx="362" cy="38" r="9" fill="#9a7838" stroke="#6a5020" stroke-width="2"/>
                <circle cx="38" cy="442" r="9" fill="#9a7838" stroke="#6a5020" stroke-width="2"/>
                <circle cx="362" cy="442" r="9" fill="#9a7838" stroke="#6a5020" stroke-width="2"/>
                <!-- Wind/Breath Symbol -->
                <g transform="translate(200,200)" fill="none" stroke="#6a5020" stroke-width="6" stroke-linecap="round">
                    <!-- Main wind body - pointed left, spirals right -->
                    <!-- Top spiral -->
                    <path d="M-60,-20 C-20,-60 60,-70 80,-40 C100,-10 70,10 50,-10 C35,-25 55,-45 75,-30" stroke-width="7"/>
                    <!-- Middle line (main flow) -->
                    <path d="M-90,10 C-50,-10 0,0 40,10 C80,20 100,5 90,-15" stroke-width="8"/>
                    <!-- Bottom spiral -->
                    <path d="M-50,40 C-10,20 50,25 70,50 C85,70 65,80 50,65 C38,52 55,38 70,48" stroke-width="7"/>
                    <!-- Small accent swirls -->
                    <path d="M-70,-45 C-55,-55 -40,-45 -45,-35" stroke-width="4"/>
                    <path d="M-60,65 C-45,55 -30,65 -38,72" stroke-width="4"/>
                </g>
                <!-- ATEM text -->
                <text x="200" y="425" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="bold" fill="#6a5020" letter-spacing="6">ATEM</text>
            </symbol>

            <!-- EISDUSCHE Symbol (Frozen Shower) -->
            <symbol id="icon-eisdusche" viewBox="0 0 400 400">
                <defs>
                    <linearGradient id="eg1" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#d0e8f5"/>
                        <stop offset="50%" stop-color="#90c0dd"/>
                        <stop offset="100%" stop-color="#6098b8"/>
                    </linearGradient>
                    <linearGradient id="eg2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#e0f0fa"/>
                        <stop offset="100%" stop-color="#80b8d5"/>
                    </linearGradient>
                    <radialGradient id="eg3" cx="50%" cy="30%">
                        <stop offset="0%" stop-color="#f0f8ff"/>
                        <stop offset="100%" stop-color="#a0d0e8"/>
                    </radialGradient>
                </defs>
                <!-- Rounded icy border -->
                <rect x="10" y="10" width="380" height="380" rx="30" fill="url(#eg1)" stroke="#5a98b5" stroke-width="5"/>
                <!-- Inner circle -->
                <circle cx="200" cy="190" r="140" fill="none" stroke="#5a98b5" stroke-width="4" opacity="0.6"/>
                <!-- Shower head -->
                <g transform="translate(200,130)">
                    <!-- Pipe -->
                    <rect x="20" y="-60" width="12" height="50" rx="4" fill="url(#eg2)" stroke="#5a98b5" stroke-width="2"/>
                    <!-- Joint -->
                    <ellipse cx="15" cy="-10" rx="18" ry="12" fill="url(#eg2)" stroke="#5a98b5" stroke-width="2"/>
                    <!-- Head -->
                    <path d="M-50,0 C-55,-15 -40,-28 -25,-30 L55,-30 C70,-28 80,-15 75,0 Z" fill="url(#eg3)" stroke="#5a98b5" stroke-width="2.5"/>
                    <!-- Holes -->
                    <circle cx="-20" cy="-15" r="4" fill="#90c0dd"/>
                    <circle cx="-5" cy="-15" r="4" fill="#90c0dd"/>
                    <circle cx="10" cy="-15" r="4" fill="#90c0dd"/>
                    <circle cx="25" cy="-15" r="4" fill="#90c0dd"/>
                    <circle cx="40" cy="-15" r="4" fill="#90c0dd"/>
                    <circle cx="-12" cy="-4" r="3.5" fill="#90c0dd"/>
                    <circle cx="3" cy="-4" r="3.5" fill="#90c0dd"/>
                    <circle cx="18" cy="-4" r="3.5" fill="#90c0dd"/>
                    <circle cx="33" cy="-4" r="3.5" fill="#90c0dd"/>
                </g>
                <!-- Water streams with icicle effect -->
                <g stroke="#a0d5ea" stroke-width="3" stroke-linecap="round" fill="none">
                    <line x1="165" y1="135" x2="155" y2="250"/>
                    <line x1="180" y1="135" x2="175" y2="270"/>
                    <line x1="195" y1="135" x2="193" y2="280"/>
                    <line x1="210" y1="135" x2="212" y2="275"/>
                    <line x1="225" y1="135" x2="230" y2="260"/>
                    <line x1="240" y1="135" x2="248" y2="245"/>
                </g>
                <!-- Icicle drops at bottom of streams -->
                <g fill="#c0e5f2">
                    <polygon points="153,250 157,250 155,265"/>
                    <polygon points="173,270 177,270 175,288"/>
                    <polygon points="191,280 195,280 193,298"/>
                    <polygon points="210,275 214,275 212,293"/>
                    <polygon points="228,260 232,260 230,278"/>
                    <polygon points="246,245 250,245 248,262"/>
                </g>
                <!-- Snowflakes decorating corners -->
                <g stroke="#c0dde8" stroke-width="1.5" fill="none" opacity="0.6">
                    <!-- Top-left snowflake -->
                    <g transform="translate(55,55)">
                        <line x1="0" y1="-10" x2="0" y2="10"/>
                        <line x1="-9" y1="-5" x2="9" y2="5"/>
                        <line x1="-9" y1="5" x2="9" y2="-5"/>
                    </g>
                    <!-- Top-right snowflake -->
                    <g transform="translate(345,55)">
                        <line x1="0" y1="-12" x2="0" y2="12"/>
                        <line x1="-10" y1="-6" x2="10" y2="6"/>
                        <line x1="-10" y1="6" x2="10" y2="-6"/>
                    </g>
                    <!-- Bottom-left snowflake -->
                    <g transform="translate(55,345)">
                        <line x1="0" y1="-8" x2="0" y2="8"/>
                        <line x1="-7" y1="-4" x2="7" y2="4"/>
                        <line x1="-7" y1="4" x2="7" y2="-4"/>
                    </g>
                    <!-- Bottom-right snowflake -->
                    <g transform="translate(345,345)">
                        <line x1="0" y1="-10" x2="0" y2="10"/>
                        <line x1="-9" y1="-5" x2="9" y2="5"/>
                        <line x1="-9" y1="5" x2="9" y2="-5"/>
                    </g>
                    <!-- Mid-left -->
                    <g transform="translate(40,200)">
                        <line x1="0" y1="-7" x2="0" y2="7"/>
                        <line x1="-6" y1="-3.5" x2="6" y2="3.5"/>
                        <line x1="-6" y1="3.5" x2="6" y2="-3.5"/>
                    </g>
                    <!-- Mid-right -->
                    <g transform="translate(360,190)">
                        <line x1="0" y1="-9" x2="0" y2="9"/>
                        <line x1="-8" y1="-4.5" x2="8" y2="4.5"/>
                        <line x1="-8" y1="4.5" x2="8" y2="-4.5"/>
                    </g>
                </g>
                <!-- Frost on border -->
                <g fill="#d8ecf5" opacity="0.3">
                    <rect x="10" y="10" width="380" height="380" rx="30" fill="none" stroke="#b0d8e8" stroke-width="8" stroke-dasharray="15,25" opacity="0.3"/>
                </g>
            </symbol>
        </defs>
    </svg>

    <!-- ===== MAIN MENU SCREEN ===== -->
    <div id="main-menu" class="screen active">
        <div class="menu-container">
            <div class="symbol-row top-row">
                <div class="symbol-item" id="kaelte-btn">
                    <svg class="symbol-img"><use href="#icon-kaelte"/></svg>
                </div>
            </div>
            <div class="symbol-row bottom-row">
                <div class="symbol-item" id="geist-btn">
                    <svg class="symbol-img"><use href="#icon-geist"/></svg>
                </div>
                <div class="symbol-item" id="atem-btn">
                    <svg class="symbol-img"><use href="#icon-atem"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== KÄLTE SUB-MENU SCREEN ===== -->
    <div id="kaelte-menu" class="screen">
        <button class="back-btn" id="back-to-main">&larr;</button>
        <div class="kaelte-container">
            <div class="eisdusche-symbol" id="eisdusche-btn">
                <svg class="eisdusche-img"><use href="#icon-eisdusche"/></svg>
                <span class="symbol-label">EISDUSCHE</span>
            </div>
        </div>
    </div>

    <!-- ===== COLD SHOWER TRACKER SCREEN ===== -->
    <div id="tracker-screen" class="screen">
        <button class="back-btn" id="back-to-kaelte">&larr;</button>

        <!-- Setup View -->
        <div id="setup-view" class="tracker-view">
            <h1 class="tracker-title">EISDUSCHE</h1>
            <svg class="tracker-icon"><use href="#icon-eisdusche"/></svg>

            <div class="slider-group">
                <label class="slider-label">
                    <span class="label-text">Vorbereitung</span>
                    <span class="label-value" id="prep-value">1:00</span>
                </label>
                <input type="range" id="prep-slider" class="slider" min="0" max="300" value="60" step="15">
            </div>

            <div class="slider-group">
                <label class="slider-label">
                    <span class="label-text">Wassertemperatur</span>
                    <span class="label-value" id="temp-value">10°C</span>
                </label>
                <input type="range" id="temp-slider" class="slider temp-slider" min="1" max="20" value="10" step="1">
            </div>

            <div class="slider-group">
                <label class="slider-label">
                    <span class="label-text">Duschdauer</span>
                    <span class="label-value" id="duration-value">2:00</span>
                </label>
                <input type="range" id="duration-slider" class="slider" min="15" max="600" value="120" step="15">
            </div>

            <button class="start-btn" id="start-btn">START</button>
        </div>

        <!-- Timer View -->
        <div id="timer-view" class="tracker-view hidden">
            <div class="timer-phase" id="timer-phase">VORBEREITUNG</div>
            <div class="timer-display" id="timer-display">1:00</div>
            <div class="timer-temp" id="timer-temp"></div>
            <div class="progress-ring-container">
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <circle class="progress-ring-bg" cx="100" cy="100" r="90"/>
                    <circle class="progress-ring-fill" id="progress-circle" cx="100" cy="100" r="90"/>
                </svg>
            </div>
            <button class="stop-btn" id="stop-btn">ABBRECHEN</button>
        </div>

        <!-- Done View -->
        <div id="done-view" class="tracker-view hidden">
            <div class="done-icon">&#10003;</div>
            <h2 class="done-title">GESCHAFFT!</h2>
            <div class="done-stats">
                <div class="stat">
                    <span class="stat-label">Dauer</span>
                    <span class="stat-value" id="stat-duration"></span>
                </div>
                <div class="stat">
                    <span class="stat-label">Temperatur</span>
                    <span class="stat-value" id="stat-temp"></span>
                </div>
            </div>
            <button class="start-btn" id="done-btn">ZURÜCK</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
